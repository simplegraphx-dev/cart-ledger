<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vitals Ledger">
<title>Vitals & Vacation Ledger</title>
<style>
  :root {
    --bg: #EDF1F0;
    --card: #FFFFFF;
    --text: #1C1C1E;
    --accent: #007AFF;
    --border: #E5E5EA;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top));
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  h2, h3 { margin-top: 0; }
  .form-group {
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  input[type="date"], input[type="number"], input[type="text"] {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 1rem;
  }
  button {
    width: 100%;
    background-color: var(--accent);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
  .stats-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #F2F2F7;
    padding: 12px;
    border-radius: 8px;
  }
  .stats-number {
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--accent);
  }
  .entry-item {
    border-bottom: 1px solid var(--border);
    padding: 8px 0;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

  <!-- YTD Summary Card -->
  <div class="card">
    <h3><span id="currentYear"></span> Vacation Summary</h3>
    <div class="stats-box">
      <span>Total Vacation Hours Used:</span>
      <span class="stats-number" id="ytdVacation">0 hrs</span>
    </div>
  </div>

  <!-- Entry Form Card -->
  <div class="card">
    <h3>Log Daily Entry</h3>
    <form id="ledgerForm">
      <div class="form-group">
        <label for="entryDate">Date</label>
        <input type="date" id="entryDate" required>
      </div>
      <div class="form-group">
        <label for="vacationHours">Vacation Hours Taken</label>
        <input type="number" id="vacationHours" step="0.5" min="0" placeholder="e.g. 8">
      </div>
      <div class="form-group">
        <label for="notes">Notes / Vitals</label>
        <input type="text" id="notes" placeholder="Additional details...">
      </div>
      <button type="submit">Save Entry</button>
    </form>
  </div>

  <!-- Recent Entries Card -->
  <div class="card">
    <h3>Logged Entries</h3>
    <div id="entriesList">No entries recorded yet.</div>
  </div>

<script>
  const currentYear = new Date().getFullYear();
  document.getElementById('currentYear').innerText = currentYear;
  document.getElementById('entryDate').valueAsDate = new Date();

  function getStoredEntries() {
    return JSON.parse(localStorage.getItem('vitals_ledger') || '[]');
  }

  function saveEntries(entries) {
    localStorage.setItem('vitals_ledger', JSON.stringify(entries));
    render();
  }

  function render() {
    const entries = getStoredEntries();
    const listEl = document.getElementById('entriesList');
    
    // Calculate YTD Vacation Hours
    const ytdTotal = entries.reduce((total, entry) => {
      const entryYear = new Date(entry.date).getFullYear();
      if (entryYear === currentYear) {
        return total + (parseFloat(entry.vacationHours) || 0);
      }
      return total;
    }, 0);

    document.getElementById('ytdVacation').innerText = `${ytdTotal} hrs`;

    // Render Recent Entries List
    if (entries.length === 0) {
      listEl.innerHTML = 'No entries recorded yet.';
      return;
    }

    listEl.innerHTML = entries.sort((a,b) => new Date(b.date) - new Date(a.date))
      .map(entry => `
        <div class="entry-item">
          <div>
            <strong>${entry.date}</strong><br>
            <small>${entry.notes || 'No notes'}</small>
          </div>
          <div>
            ${entry.vacationHours ? `<strong>${entry.vacationHours} hrs</strong>` : '0 hrs'}
          </div>
        </div>
      `).join('');
  }

  document.getElementById('ledgerForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const date = document.getElementById('entryDate').value;
    const vacationHours = parseFloat(document.getElementById('vacationHours').value) || 0;
    const notes = document.getElementById('notes').value;

    const entries = getStoredEntries();
    entries.push({ date, vacationHours, notes });
    saveEntries(entries);

    // Reset Form
    document.getElementById('vacationHours').value = '';
    document.getElementById('notes').value = '';
  });

  // Initial Load
  render();
</script>
</body>
</html>
